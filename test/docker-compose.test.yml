services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    # Dotted alias for the Playwright container to navigate to: Chromium's
    # automatic HTTPS-upgrade heuristic forces https:// for single-label
    # hostnames (e.g. bare "app"), which then fails against our plain-HTTP
    # server with ERR_SSL_PROTOCOL_ERROR. A dotted hostname avoids the heuristic.
    networks:
      default:
        aliases:
          - app.test
    environment:
      - LLM_MOCK=true
      - OPENROUTER_API_KEY=test-key
      - MASSIVE_API_KEY=
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  playwright:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /work
    volumes:
      - ..:/work
    environment:
      - BASE_URL=http://app.test:8000
      - CI=true
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - "cd test && npm install && npx playwright test"
